<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif; border-radius:10px; border:1px solid #30363d;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="600" letter-spacing="0.5">Defense-in-Depth: Multi-Layered .pth Countermeasures</text>

  <!-- Layer 1 Box -->
  <g transform="translate(30, 65)">
    <rect width="260" height="275" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <rect width="260" height="42" rx="8" fill="#1f6feb" fill-opacity="0.25"/>
    <text x="130" y="27" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">1. Build-Time CI Gates</text>
    
    <!-- Item 1 -->
    <rect x="15" y="55" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="77" fill="#e6edf3" font-size="12" font-weight="600">Pre-install Wheel Inspection</text>
    <text x="25" y="97" fill="#8b949e" font-size="11">Inspect .whl ZIPs for *.pth files</text>

    <!-- Item 2 -->
    <rect x="15" y="125" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="147" fill="#e6edf3" font-size="12" font-weight="600">Executable .pth Scanner</text>
    <text x="25" y="167" fill="#8b949e" font-size="11">Fail on unauthorized import lines</text>

    <!-- Item 3 -->
    <rect x="15" y="195" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="217" fill="#e6edf3" font-size="12" font-weight="600">Lockfile Hash Pinning</text>
    <text x="25" y="237" fill="#8b949e" font-size="11">Enforce pip --require-hashes</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="295" y1="202" x2="340" y2="202" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 2 Box -->
  <g transform="translate(350, 65)">
    <rect width="260" height="275" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect width="260" height="42" rx="8" fill="#2ea043" fill-opacity="0.25"/>
    <text x="130" y="27" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">2. Runtime Telemetry</text>

    <!-- Item 1 -->
    <rect x="15" y="55" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="77" fill="#e6edf3" font-size="12" font-weight="600">Falco eBPF Syscall Rules</text>
    <text x="25" y="97" fill="#8b949e" font-size="11">Detect open_write on *.pth</text>

    <!-- Item 2 -->
    <rect x="15" y="125" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="147" fill="#e6edf3" font-size="12" font-weight="600">Read-Only Filesystems</text>
    <text x="25" y="167" fill="#8b949e" font-size="11">Immutable site-packages in prod</text>

    <!-- Item 3 -->
    <rect x="15" y="195" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="217" fill="#e6edf3" font-size="12" font-weight="600">Kernel Sensor Coverage</text>
    <text x="25" y="237" fill="#8b949e" font-size="11">Monitor ephemeral venvs</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="615" y1="202" x2="660" y2="202" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 3 Box -->
  <g transform="translate(670, 65)">
    <rect width="260" height="275" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect width="260" height="42" rx="8" fill="#bb8009" fill-opacity="0.25"/>
    <text x="130" y="27" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="700">3. Fleet Hunting &amp; IR</text>

    <!-- Item 1 -->
    <rect x="15" y="55" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="77" fill="#e6edf3" font-size="12" font-weight="600">Osquery Fleet Audit</text>
    <text x="25" y="97" fill="#8b949e" font-size="11">Scan system &amp; user .pth paths</text>

    <!-- Item 2 -->
    <rect x="15" y="125" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="147" fill="#e6edf3" font-size="12" font-weight="600">YARA Regex Detection</text>
    <text x="25" y="167" fill="#8b949e" font-size="11">Match ^import pattern</text>

    <!-- Item 3 -->
    <rect x="15" y="195" width="230" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="25" y="217" fill="#e6edf3" font-size="12" font-weight="600">Credential Invalidation</text>
    <text x="25" y="237" fill="#8b949e" font-size="11">Revoke tokens, PATs &amp; caches</text>
  </g>
</svg>